["சாமியானா பந்தல் 10x10","Samiyana pandal 10x10"],["சாமியானா பந்தல் 10x15","Samiyana pandal 10x15"],["சாமியானா பந்தல் 10x20","Samiyana pandal 10x20"],["சாமியானா பந்தல் 10x30","Samiyana pandal 10x30"],["சாமியானா பந்தல் 12x24","Samiyana pandal 12x24"],["சாமியானா பந்தல் 15x20","Samiyana pandal 15x20"],["சாமியானா பந்தல் 15x30","Samiyana pandal 15x30"],["சாமியானா பந்தல் 20x20","Samiyana pandal 20x20"],["சாமியானா பந்தல் 20x30","Samiyana pandal 20x30"],["சாமியானா பந்தல் 20x40","Samiyana pandal 20x40"],
["டிசைன் பந்தல் 15x10","Design pandal 15x10"],["டிசைன் பந்தல் 15x20","Design pandal 15x20"],["டிசைன் பந்தல் 15x30","Design pandal 15x30"],["பந்தல் குச்சி","Pandal poles"],["பந்தல் ஆணி","Pandal nails"],
["சைடு மரப்பு துணி 6x20","Side cloth 6x20"],["சைடு டிசைன் துணி","Side design cloth"],["டேபிள் டிசைன் துணி","Table design cloth"],
["மிக்ஸி - ஜார்","Mixie jar"],["தேங்காய் திருகல் மிஷின்","Coconut scraper machine"],["தேங்காய் திருகல் கட்டை","Coconut scraper block"],["அருவாமனை","Aruvamanai (cutting blade)"],["மில்க் கேன்","Milk can"],["தண்ணீர் பாரல்","Water barrel"]
];
const C=[[0,"அடுப்பு & சமையல்","Stoves & Cooking"],[7,"டவரா & பாத்திரங்கள்","Davara & Vessels"],[21,"சில்வர் பாத்திரங்கள்","Steel items"],[31,"இரும்பு & சேர்","Iron & Chairs"],[35,"பந்தல் & துணி","Pandal & Cloth"],[53,"மற்றவை","Others"]];
const SHOP="919585563162", KEY="kvs_order_v3";
const Q=new Array(I.length).fill(0);
let ono="", lang="both";
const $=id=>document.getElementById(id);
const S=(ta,en)=>`<span class="ta">${ta}</span><span class="en">${en}</span>`;

// ---------- build list ----------
(function(){
  let h="",ch="";
  C.forEach((c,ci)=>{
    const end=C[ci+1]?C[ci+1][0]:I.length;
    h+=`<section data-c="${ci}"><div class="cat" id="cat${ci}"><div class="ct">${S(c[1],c[2])}</div></div>`;
    for(let i=c[0];i<end;i++){
      h+=`<div class="item" id="r${i}" data-s="${(I[i][0]+" "+I[i][1]).toLowerCase()}"><div class="nm">${S(I[i][0],I[i][1])}</div>
      <div class="step"><button class="m" data-i="${i}" data-d="-1" aria-label="-">−</button><input id="q${i}" type="number" inputmode="numeric" min="0" value="0" data-i="${i}"><button data-i="${i}" data-d="1" aria-label="+">+</button></div></div>`;
    }
    h+="</section>";
    ch+=`<button class="chip" data-go="${ci}">${S(c[1],c[2])}</button>`;
  });
  $("list").innerHTML=h; $("chips").innerHTML=ch;
})();

// ---------- state ----------
function save(){try{localStorage.setItem(KEY,JSON.stringify({q:Q,ono,lang,c:{n:$("cName").value,v:$("cVillage").value,p:$("cPhone").value}}))}catch(e){}}
function load(){try{const d=JSON.parse(localStorage.getItem(KEY)||"null");if(!d)return;
  (d.q||[]).forEach((v,i)=>{if(i<Q.length)Q[i]=v|0});ono=d.ono||"";if(d.lang)setLang(d.lang,true);
  if(d.c){$("cName").value=d.c.n||"";$("cVillage").value=d.c.v||"";$("cPhone").value=d.c.p||""}}catch(e){}}
function setQ(i,v){Q[i]=Math.max(0,Math.min(999,v|0));sync(i);if($("sheet").classList.contains("open"))drawSheet();save()}
function sync(i){
  const inp=$("q"+i);if(document.activeElement!==inp||inp.value!==String(Q[i]))inp.value=Q[i];
  $("r"+i).classList.toggle("on",Q[i]>0);counts()}
function counts(){
  const t=Q.filter(x=>x>0).length,s=Q.reduce((a,b)=>a+b,0);
  $("cTypes").textContent=t;$("cQty").textContent=t?("மொத்த எண்ணிக்கை / Total qty: "+s):"+ ஐ அழுத்தி சேர்க்கவும் / Tap + to add";
  $("reviewBtn").disabled=!t}
function setLang(l,quiet){lang=l;document.body.className="l-"+l;
  document.querySelectorAll(".seg button").forEach(b=>b.classList.toggle("on",b.dataset.l===l));if(!quiet)save()}
function toast(m){const t=$("toast");t.textContent=m;t.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display="none",2600)}
function genNo(){const d=new Date();return "KVS-"+d.getFullYear()+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0")+"-"+Math.floor(1000+Math.random()*9000)}
function today(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}

// ---------- events ----------
$("list").addEventListener("click",e=>{const b=e.target.closest("button[data-i]");if(!b)return;const i=+b.dataset.i;setQ(i,Q[i]+ +b.dataset.d)});
$("list").addEventListener("input",e=>{if(e.target.matches("input[data-i]")){const i=+e.target.dataset.i;Q[i]=Math.max(0,Math.min(999,parseInt(e.target.value)||0));$("r"+i).classList.toggle("on",Q[i]>0);counts();save()}});
$("list").addEventListener("focusin",e=>{if(e.target.matches("input[data-i]"))e.target.select()});
$("list").addEventListener("focusout",e=>{if(e.target.matches("input[data-i]"))sync(+e.target.dataset.i)});
$("chips").addEventListener("click",e=>{const b=e.target.closest("[data-go]");if(b){$("search").value="";filter();$("cat"+b.dataset.go).scrollIntoView({behavior:"smooth"})}});
document.querySelector(".seg").addEventListener("click",e=>{const b=e.target.closest("button");if(b)setLang(b.dataset.l)});
function filter(){
  const q=$("search").value.trim().toLowerCase();let any=false;
  document.querySelectorAll("#list section").forEach(sec=>{let n=0;
    sec.querySelectorAll(".item").forEach(it=>{const ok=!q||it.dataset.s.includes(q);it.style.display=ok?"":"none";if(ok)n++});
    sec.style.display=n?"":"none";if(n)any=true});
  $("empty").style.display=any?"none":"block"}
$("search").addEventListener("input",filter);

// ---------- review sheet ----------
function drawSheet(){
  let h="";let n=0;
  Q.forEach((q,i)=>{if(q>0){n++;h+=`<div class="item on"><div class="nm">${S(I[i][0],I[i][1])}</div><div class="step"><button class="m" data-i="${i}" data-d="-1">−</button><div class="v">${q}</div><button data-i="${i}" data-d="1">+</button></div></div>`}});
  $("sList").innerHTML=h||`<p class="empty" style="display:block">${S("பொருட்கள் இல்லை","No items selected")}</p>`;
}
$("sList").addEventListener("click",e=>{const b=e.target.closest("button[data-i]");if(!b)return;const i=+b.dataset.i;setQ(i,Q[i]+ +b.dataset.d)});
$("reviewBtn").onclick=()=>{if(!ono)ono=genNo();$("ono").textContent=ono;if(!$("cDate").value)$("cDate").value=today();drawSheet();$("sheet").classList.add("open");$("sheet").scrollTop=0;save()};
$("backBtn").onclick=()=>$("sheet").classList.remove("open");
$("newNo").onclick=()=>{ono=genNo();$("ono").textContent=ono;save()};
["cName","cVillage"].forEach(id=>$(id).addEventListener("input",save));
$("cPhone").addEventListener("input",e=>{e.target.value=e.target.value.replace(/\D/g,"").slice(0,10);if(phoneOk())$("phErr").style.display="none";save()});
function phoneOk(){return /^[6-9]\d{9}$/.test($("cPhone").value)}
function checkPhone(){if(phoneOk())return true;$("phErr").style.display="block";$("cPhone").focus();$("cPhone").scrollIntoView({block:"center",behavior:"smooth"});toast("சரியான 10 இலக்க செல் எண் தேவை / Valid 10-digit mobile no. required");return false}
let clrArm=false;
$("clrBtn").onclick=()=>{if(!clrArm){clrArm=true;toast("மீண்டும் அழுத்தவும் / Tap again to clear");setTimeout(()=>clrArm=false,3000);return}
  clrArm=false;Q.fill(0);for(let i=0;i<Q.length;i++)sync(i);ono=genNo();$("ono").textContent=ono;drawSheet();save();$("sheet").classList.remove("open")};

function info(){return{n:$("cName").value||"-",v:$("cVillage").value||"-",p:$("cPhone").value||"-",d:$("cDate").value||today()}}
function rows(){return Q.map((q,i)=>q>0?{i,q}:null).filter(Boolean)}

// ---------- WhatsApp ----------
$("waBtn").onclick=()=>{
  const r=rows();if(!r.length)return toast("பொருட்களை தேர்வு செய்யவும் / Select items first");
  if(!checkPhone())return;
  const c=info(),tq=r.reduce((a,x)=>a+x.q,0),ln="━━━━━━━━━━━━━━";
  let t=`*KVS குமார் வாடகை பாத்திரக்கடை*\n*Sri Vinayaga Suppliers*\n${ln}\n*ஆர்டர் எண் / Order no:* ${ono}\n*பெயர் / Name:* ${c.n}\n*ஊர் / Village:* ${c.v}\n*செல் / Phone:* ${c.p}\n*தேதி / Date:* ${c.d}\n${ln}\n*பொருட்கள் பட்டியல் / Item List*\n\n`;
  r.forEach((x,k)=>t+=`${k+1}. ${I[x.i][0]} (${I[x.i][1]}) - *${x.q}*\n`);
  t+=`${ln}\n*மொத்த வகைகள் / Total items:* ${r.length}\n*மொத்த எண்ணிக்கை / Total qty:* ${tq}`;
  window.open("https://wa.me/"+SHOP+"?text="+encodeURIComponent(t),"_blank");
};

// ---------- PDF ----------
$("pdfBtn").onclick=async()=>{
  const r=rows();if(!r.length)return toast("பொருட்களை தேர்வு செய்யவும் / Select items first");
  if(!checkPhone())return;
  const btn=$("pdfBtn"),old=btn.innerHTML;btn.disabled=true;btn.textContent="…";
  try{
    const c=info(),el=$("receipt");
    el.innerHTML=`<h3>KVS குமார் வாடகை பாத்திரக்கடை</h3><small>Sri Vinayaga Suppliers · 95855 63162 | 70103 85238<br>ஸ்ரீமுஷ்ணம் ரோடு, கருவேப்பிலங்குறிச்சி-606110</small>
    <p style="margin:12px 0 4px"><b>ஆர்டர் எண் / Order no:</b> ${ono}</p>
    <p style="margin:0"><b>பெயர் / Name:</b> ${c.n} &nbsp; <b>ஊர் / Village:</b> ${c.v}<br><b>செல் / Phone:</b> ${c.p} &nbsp; <b>தேதி / Date:</b> ${c.d}</p>
    <table><tr><th>#</th><th>விபரம் / Item</th><th>எண் / Qty</th></tr>${r.map((x,k)=>`<tr><td>${k+1}</td><td>${I[x.i][0]}<br><small>${I[x.i][1]}</small></td><td><b>${x.q}</b></td></tr>`).join("")}</table>
    <p style="text-align:right;margin-top:10px"><b>மொத்த வகைகள் / Total items: ${r.length}</b></p>`;
    if(document.fonts&&document.fonts.ready)await document.fonts.ready;
    const cv=await html2canvas(el,{scale:2,backgroundColor:"#fff"});
    const {jsPDF}=window.jspdf,pdf=new jsPDF({unit:"pt",format:"a4"});
    const pw=pdf.internal.pageSize.getWidth(),ph=pdf.internal.pageSize.getHeight(),m=24,w=pw-2*m,pageH=ph-2*m;
    const sliceH=Math.floor(pageH*cv.width/w);
    for(let y=0,p=0;y<cv.height;y+=sliceH,p++){
      const h=Math.min(sliceH,cv.height-y),s=document.createElement("canvas");s.width=cv.width;s.height=h;
      s.getContext("2d").drawImage(cv,0,y,cv.width,h,0,0,cv.width,h);
      if(p)pdf.addPage();pdf.addImage(s.toDataURL("image/png"),"PNG",m,m,w,h*w/cv.width);
    }
    const blob=pdf.output("blob"),fname=ono+".pdf";
    const dl=(window.claude&&window.claude.use)?await window.claude.use("downloads"):null;
    if(dl){try{await dl.save({filename:fname,data:blob});toast("✔ PDF")}catch(e){}}
    else{const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=fname;document.body.appendChild(a);a.click();a.remove();toast("✔ PDF")}
  }catch(e){toast("PDF தோல்வி / PDF failed")}
  finally{btn.disabled=false;btn.innerHTML=old;$("receipt").innerHTML=""}
};

load();for(let i=0;i<Q.length;i++)sync(i);counts();
</script>
</body>
</html>
